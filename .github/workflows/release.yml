name: Release

# Run it from the Actions tab: "Run workflow", then type a version such as v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write # needed to push the tag and create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version looks right
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version. Use the form v1.0.0 (or v1.0.0-beta.1)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Make sure the tag does not exist yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Pick a new version."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew build --no-daemon

      - name: Tag and publish the release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$VERSION" $PRERELEASE \
            --title "NeoPedro $VERSION" \
            --generate-notes \
            neopedro/build/libs/*.jar

      - name: Ask JitPack to build it now (best effort)
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          OWNER="${REPO%%/*}"; NAME="${REPO##*/}"
          URL="https://jitpack.io/com/github/$OWNER/$NAME/neopedro/$VERSION/neopedro-$VERSION.pom"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$URL" || true)
            echo "JitPack answered $code"
            [ "$code" = "200" ] && break
            sleep 20
          done
          echo "Dependency: com.github.$OWNER.$NAME:neopedro:$VERSION" >> "$GITHUB_STEP_SUMMARY"
